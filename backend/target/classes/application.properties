spring.application.name=fuelwatch-api

# ── MySQL ──────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/fuelwatch?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Scheduling ────────────────────────────────────────────────────────────────
spring.task.scheduling.pool.size=2

# ── CORS ──────────────────────────────────────────────────────────────────────
fuelwatch.cors.allowed-origins=http://localhost:3000

# ── JWT ───────────────────────────────────────────────────────────────────────
fuelwatch.jwt.secret=ThisIsAVeryLongSecretKeyForFuelWatchAuthSystem2026ChangeMe!!
fuelwatch.jwt.expiration-ms=86400000

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8089

spring.mvc.format.date-time=iso
spring.jackson.serialization.write-dates-as-timestamps=false
